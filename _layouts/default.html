<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
	<head>
		<meta charset='utf-8'>
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
		<meta name="theme-color" content="#d38700">
		<link rel="stylesheet" href="/assets/baseColors.css">
		<link rel="stylesheet" href="/assets/authorBlurb.css">
		<link rel="stylesheet" href="/assets/navFix.css">
		<link rel="stylesheet" href="/assets/style.css">
		<link rel="icon" type="image/png" href="/assets/img/AstraGroup_128x128.png">
		<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6034836920654252" crossorigin="anonymous"></script>
		{% seo %}
	</head>
	<body>
		<header>
			<div class="container">
				<a id="a-title" href="{{ '/' | relative_url }}">
					<h1>{{ site.title | default: site.github.repository_name }}</h1>
				</a>
				<h2>{{ site.description | default: site.github.project_tagline }}</h2>
			</div>
		</header>
		<nav class="navDecorations">
			 {% for item in site.data.navigation %}
			<a href="{{ item.link }}" {% if page.url == item.link %} style="color: #d38700;"{% endif %} class="btn btn-{{ item.name | remove: ' ' }}">
				<span class="icon" style="background: url('/assets/img/{{ item.img | remove: ' '}}'); background-repeat: no-repeat; background-position: center; background-size: contain;"></span>
				{{ item.name }}
			</a>
			{% endfor %}
		</nav>
		<br>
		<hr>
		<div class="container">
			<section id="main_content">
				{{ content }}
			</section>
		</div>


		{% if site.google_analytics %}
		<script>
		(function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
		(i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
		m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
		})(window,document,'script','//www.google-analytics.com/analytics.js','ga');
		ga('create', '{{ site.google_analytics }}', 'auto');
		ga('send', 'pageview');
		</script>
		{% endif %}
	</body>
</html>
